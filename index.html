<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compteur de Glucides</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2e7d32">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, system-ui, sans-serif; background: #fafafa; color: #222; }
header {
  position: sticky; top: 0; z-index: 10;
  background: #2e7d32; color: #fff;
  padding: 16px 20px; text-align: center;
  box-shadow: 0 2px 8px rgba(0,0,0,.2);
}
header h1 { font-size: 18px; font-weight: 500; margin-bottom: 4px; }
header .total { font-size: 32px; font-weight: 700; }
header .total small { font-size: 16px; font-weight: 400; }
header .nav-btn {
  position: absolute; top: 50%; transform: translateY(-50%);
  background: none; border: none; color: #fff; cursor: pointer;
  font-size: 22px; line-height: 1; padding: 8px 12px;
}
header .nav-btn.right { right: 8px; }
header .nav-btn.left { left: 8px; font-size: 28px; }
.hidden { display: none; }
.update-bar {
  display: none; width: 100%; padding: 10px; border: none;
  background: #f9a825; color: #3e2723; font-size: 14px; font-weight: 600;
  cursor: pointer; text-align: center;
}
.update-bar.show { display: block; }
.update-bar:active { background: #f57f17; }
.perso-add {
  background: #fff; border-radius: 12px; padding: 12px; margin-bottom: 12px;
  box-shadow: 0 1px 3px rgba(0,0,0,.1);
  display: grid; grid-template-columns: 1fr 80px 80px; gap: 8px;
}
.perso-add input[type="text"] { grid-column: 1 / -1; }
.perso-add-hint {
  grid-column: 1 / -1; font-size: 11px; color: #888; line-height: 1.4;
}
.perso-add .btn-add { grid-column: 1 / -1; margin-top: 0; }
.perso-list {
  background: #fff; border-radius: 12px; padding: 4px;
  box-shadow: 0 1px 3px rgba(0,0,0,.1);
}
.perso-item {
  display: flex; align-items: center; gap: 8px; padding: 8px;
  border-bottom: 1px solid #f0f0f0;
}
.perso-item input[type="text"], .perso-add input[type="text"] {
  flex: 1; border: 1px solid #ddd; border-radius: 6px; padding: 8px;
  font-size: 16px; min-width: 0;
}
.perso-item input[type="number"], .perso-add input[type="number"] {
  width: 62px; border: 1px solid #ddd; border-radius: 6px; padding: 8px 6px;
  font-size: 16px; text-align: right;
}
.perso-add input[type="number"] { width: 100%; }
.perso-item input:focus, .perso-add input:focus { outline: none; border-color: #2e7d32; }
.perso-item .perso-del {
  background: none; border: none; color: #c62828; font-size: 20px;
  cursor: pointer; padding: 4px 8px; line-height: 1;
}
.perso-empty { padding: 24px; text-align: center; color: #999; font-size: 14px; }
main { padding: 12px; max-width: 600px; margin: 0 auto; }
.row {
  background: #fff; border-radius: 12px; padding: 12px;
  margin-bottom: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.1);
  display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 8px; align-items: end;
}
.row.four { grid-template-columns: 1fr; }
.field { display: flex; flex-direction: column; }
.field label { font-size: 11px; color: #666; margin-bottom: 2px; text-transform: uppercase; }
.field input {
  border: 1px solid #ddd; border-radius: 8px; padding: 10px;
  font-size: 16px; width: 100%; background: #fafafa;
}
.field input:focus { outline: none; border-color: #2e7d32; background: #fff; }
.field .result { font-size: 18px; font-weight: 600; color: #2e7d32; padding: 10px 0; }
.row-hint {
  grid-column: 1 / -1; font-size: 11px; color: #888;
  margin-top: 2px; text-align: right;
}
.btn-pc {
  background: none; border: 1px solid #ddd; border-radius: 6px; color: #666;
  font-size: 11px; cursor: pointer; padding: 6px 4px; line-height: 1;
}
.btn-pc b { color: #2e7d32; }
.row .name-field { grid-column: 1 / -1; position: relative; }
.row .name-field input { font-weight: 500; }
.dropdown {
  position: absolute; top: 100%; left: 0; right: 0; z-index: 20;
  background: #fff; border: 1px solid #ddd; border-radius: 8px;
  margin-top: 2px; max-height: 200px; overflow-y: auto;
  box-shadow: 0 4px 12px rgba(0,0,0,.15); display: none;
}
.dropdown.open { display: block; }
.dropdown div {
  padding: 10px 12px; font-size: 15px; cursor: pointer;
  display: flex; justify-content: space-between; align-items: center;
}
.dropdown div:active, .dropdown div.active { background: #e8f5e9; }
.dropdown div span.pct { color: #888; font-size: 13px; }
.dropdown div .del-perso {
  color: #c62828; font-size: 16px; font-weight: 700; margin-left: 8px;
  padding: 2px 6px; border-radius: 4px; line-height: 1;
}
.dropdown div .del-perso:active { background: #fce4ec; }
.btn-delete {
  background: none; border: none; color: #c62828; font-size: 24px;
  cursor: pointer; padding: 8px; line-height: 1; border-radius: 8px;
}
.btn-delete:active { background: #fce4ec; }
.row-actions { display: flex; align-items: end; gap: 0; }
.btn-save-perso {
  background: none; border: none; color: #ccc; font-size: 20px;
  cursor: pointer; padding: 8px 0; line-height: 1; border-radius: 8px;
}
.btn-save-perso:active { color: #f9a825; }
.btn-save-perso.saved { color: #f9a825; }
.btn-add {
  display: block; width: 100%; padding: 14px; margin-top: 4px;
  background: #2e7d32; color: #fff; border: none; border-radius: 12px;
  font-size: 16px; font-weight: 600; cursor: pointer;
}
.btn-add:active { background: #1b5e20; }
.btn-reset {
  display: block; width: 100%; padding: 12px; margin-top: 8px;
  background: none; color: #999; border: 1px solid #ddd; border-radius: 12px;
  font-size: 14px; cursor: pointer;
}
</style>
</head>
<body>

<header>
  <h1 id="page-title">Glucides du repas</h1>
  <div class="total" id="header-total"><span id="total">0</span><small> g</small></div>
  <button class="nav-btn right" id="btn-perso" title="Aliments perso" onclick="location.hash='perso'">⚙</button>
  <button class="nav-btn left hidden" id="btn-back" title="Retour" onclick="history.back()">‹</button>
</header>

<button class="update-bar" id="update-bar">Nouvelle version disponible — Recharger</button>

<main id="view-repas">
  <div id="rows"></div>
  <button class="btn-add" onclick="addRow()">+ Ajouter une ligne</button>
  <button class="btn-reset" onclick="resetAll()">Nouveau repas</button>
  <p style="margin-top:24px;font-size:11px;color:#aaa;text-align:center;line-height:1.4">Valeurs indicatives pouvant varier selon les produits et préparations. Ne se substitue pas à un avis médical.<br>Données : Anses, Table Ciqual 2025 — Licence Ouverte.</p>
</main>

<main id="view-perso" class="hidden">
  <div class="perso-add">
    <input type="text" id="new-nom" placeholder="Nom de l'aliment" autocomplete="off">
    <input type="number" inputmode="decimal" id="new-unite" placeholder="g/pc">
    <input type="number" inputmode="decimal" id="new-pct" placeholder="% gluc.">
    <p class="perso-add-hint">« g/pc » : poids d'une portion, à remplir pour compter en unités plutôt qu'en grammes (ex. madeleine = 30 g).</p>
    <button class="btn-add" onclick="addPerso()">+ Ajouter</button>
  </div>
  <div class="perso-list" id="perso-list"></div>
</main>

<script src="aliments-light.js"></script>
<script src="aliments-full.js"></script>
<script>
let rows = JSON.parse(localStorage.getItem('glucides-rows') || '[]');
let perso = JSON.parse(localStorage.getItem('glucides-perso') || '[]');

const container = document.getElementById('rows');
const totalEl = document.getElementById('total');

const viewPerso = document.getElementById('view-perso');

function route() {
  const onPerso = location.hash === '#perso';
  viewPerso.classList.toggle('hidden', !onPerso);
  document.getElementById('view-repas').classList.toggle('hidden', onPerso);
  document.getElementById('header-total').classList.toggle('hidden', onPerso);
  document.getElementById('btn-perso').classList.toggle('hidden', onPerso);
  document.getElementById('btn-back').classList.toggle('hidden', !onPerso);
  document.getElementById('page-title').textContent = onPerso ? '★ Aliments perso' : 'Glucides du repas';
  if (onPerso) renderPerso();
}

window.addEventListener('hashchange', route);

function renderPerso() {
  const list = document.getElementById('perso-list');
  if (!perso.length) {
    list.innerHTML = '<div class="perso-empty">Aucun aliment personnalisé</div>';
    return;
  }
  list.innerHTML = perso.map((p, i) =>
    `<div class="perso-item">` +
    `<input type="text" value="${esc(p.nom)}" data-pi="${i}" data-pf="nom">` +
    `<input type="number" inputmode="decimal" value="${p.unite || ''}" data-pi="${i}" data-pf="unite" placeholder="g/pc">` +
    `<input type="number" inputmode="decimal" value="${p.pct}" data-pi="${i}" data-pf="pct" placeholder="%">` +
    `<span style="font-size:12px;color:#888">%</span>` +
    `<button class="perso-del" data-pdel="${i}">×</button>` +
    `</div>`
  ).join('');
}

function addPerso() {
  const nomInp = document.getElementById('new-nom');
  const pctInp = document.getElementById('new-pct');
  const uniteInp = document.getElementById('new-unite');
  const nom = nomInp.value.trim();
  const pct = parseFloat(pctInp.value) || 0;
  const unite = parseFloat(uniteInp.value) || 0;
  if (!nom) { nomInp.focus(); return; }
  if (pct <= 0) { pctInp.focus(); return; }
  if (perso.find(p => p.nom === nom)) { nomInp.focus(); return; }
  perso.push(unite > 0 ? { nom, pct, unite } : { nom, pct });
  savePerso();
  nomInp.value = '';
  pctInp.value = '';
  uniteInp.value = '';
  renderPerso();
  nomInp.focus();
}

viewPerso.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.closest('.perso-add')) addPerso();
});

viewPerso.addEventListener('click', e => {
  const del = e.target.closest('[data-pdel]');
  if (del) {
    perso.splice(+del.dataset.pdel, 1);
    savePerso();
    renderPerso();
  }
});

viewPerso.addEventListener('input', e => {
  const inp = e.target;
  const i = inp.dataset.pi;
  if (i == null) return;
  const f = inp.dataset.pf;
  if (f === 'nom') perso[+i].nom = inp.value;
  else if (f === 'pct') perso[+i].pct = parseFloat(inp.value) || 0;
  else if (f === 'unite') perso[+i].unite = parseFloat(inp.value) || 0;
  savePerso();
});

function savePerso() {
  localStorage.setItem('glucides-perso', JSON.stringify(perso));
}

function save() {
  localStorage.setItem('glucides-rows', JSON.stringify(rows));
}

// A row holds either grams or a number of portions; unite is the weight of one portion
function grams(r) { return (r.pc && r.unite ? r.poids * r.unite : r.poids) || 0; }
function gluc(r) { return grams(r) * r.pct / 100 || 0; }
function r1(n) { return Math.round(n * 10) / 10; }

function update() {
  let t = 0;
  rows.forEach(r => { t += gluc(r); });
  totalEl.textContent = r1(t);
  save();
}

function render() {
  container.innerHTML = '';
  rows.forEach((r, i) => {
    const g = r1(gluc(r));
    const div = document.createElement('div');
    div.className = 'row';
    div.innerHTML = `
      <div class="field name-field">
        <label>Aliment</label>
        <input type="text" value="${esc(r.nom)}" placeholder="ex: Riz" autocomplete="off"
          data-i="${i}" data-f="nom">
        <div class="dropdown" data-i="${i}"></div>
      </div>
      <div class="field">
        <label>${r.pc ? 'Nombre' : 'Poids (g)'}</label>
        <input type="number" inputmode="decimal" value="${r.poids || ''}"
          placeholder="0" data-i="${i}" data-f="poids">
      </div>
      <div class="field">
        <label>Glucides %</label>
        <input type="number" inputmode="decimal" value="${r.pct || ''}"
          placeholder="0" data-i="${i}" data-f="pct">
      </div>
      <div class="field" style="text-align:center">
        <label>= g</label>
        <div class="result">${g}</div>
      </div>
      <div class="row-actions">
        ${r.unite ? `<button class="btn-pc" onclick="togglePc(${i})" title="Grammes ou portions">${r.pc ? 'g|<b>pc</b>' : '<b>g</b>|pc'}</button>` : ''}
        <button class="btn-save-perso" onclick="saveRowPerso(${i})" title="Sauvegarder en perso">★</button>
        <button class="btn-delete" onclick="delRow(${i})">×</button>
      </div>
      ${r.pc ? `<div class="row-hint">${r.poids || 0} × ${r.unite} g = ${r1(grams(r))} g</div>` : ''}
    `;
    container.appendChild(div);
  });
  update();
}

function esc(s) { return (s || '').replace(/"/g, '&quot;'); }
function norm(s) { return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }

container.addEventListener('focusin', e => {
  const inp = e.target;
  if (inp.dataset.f === 'nom' && inp.value.trim()) showDropdown(inp, +inp.dataset.i);
});

container.addEventListener('focusout', e => {
  const inp = e.target;
  if (inp.dataset.f === 'nom') {
    setTimeout(() => {
      const dd = inp.parentElement.querySelector('.dropdown');
      if (dd) dd.classList.remove('open');
    }, 150);
  }
});

container.addEventListener('input', e => {
  const inp = e.target;
  if (!inp.dataset.f) return;
  const i = +inp.dataset.i, f = inp.dataset.f;
  rows[i][f] = f === 'nom' ? inp.value : parseFloat(inp.value) || 0;
  const row = inp.closest('.row');
  row.querySelector('.result').textContent = r1(gluc(rows[i]));
  const hint = row.querySelector('.row-hint');
  if (hint) hint.textContent = `${rows[i].poids || 0} × ${rows[i].unite} g = ${r1(grams(rows[i]))} g`;
  update();
  if (f === 'nom') showDropdown(inp, i);
});

function showDropdown(inp, i) {
  const dd = inp.parentElement.querySelector('.dropdown');
  const q = norm(inp.value.trim());
  if (q.length === 0) { dd.classList.remove('open'); return; }

  // Priority order: perso, then light base, then full base — deduped by name, 8 max
  const all = [];
  perso.filter(a => norm(a.nom).includes(q))
    .forEach(a => all.push({nom: a.nom, pct: a.pct, unite: a.unite || 0, perso: true}));
  [...ALIMENTS_LIGHT, ...ALIMENTS_FULL].filter(a => norm(a.nom).includes(q)).forEach(a => {
    if (!all.find(x => x.nom === a.nom)) all.push({nom: a.nom, pct: a.pct, perso: false});
  });
  const matches = all.slice(0, 8);

  if (!matches.length) { dd.classList.remove('open'); return; }

  const html = matches.map((a, j) =>
    `<div data-ai="${i}" data-aj="${j}" class="${j===0?'active':''}">` +
    `${a.perso ? '★ ' : ''}${esc(a.nom)}` +
    `<span class="pct">${a.unite ? a.unite + ' g/pc · ' : ''}${a.pct}%</span>` +
    `${a.perso ? '<span class="del-perso" data-delperso="'+esc(a.nom)+'">×</span>' : ''}` +
    `</div>`
  ).join('');

  dd.innerHTML = html;
  dd._matches = matches;
  dd.classList.add('open');
}

container.addEventListener('click', e => {
  // Delete perso
  const delBtn = e.target.closest('[data-delperso]');
  if (delBtn) {
    e.stopPropagation();
    const nom = delBtn.dataset.delperso;
    perso = perso.filter(p => p.nom !== nom);
    savePerso();
    // Refresh dropdown
    const dd = delBtn.closest('.dropdown');
    const i = +dd.dataset.i;
    const inp = dd.parentElement.querySelector('input[data-f="nom"]');
    showDropdown(inp, i);
    return;
  }

  // Select aliment
  const item = e.target.closest('.dropdown div');
  if (!item || item.classList.contains('dd-save')) return;
  const dd = item.closest('.dropdown');
  const i = +dd.dataset.i;
  const j = +item.dataset.aj;
  const a = dd._matches[j];
  selectAliment(i, a);
  dd.classList.remove('open');
});

function saveRowPerso(i) {
  const nom = rows[i].nom.trim();
  const pct = rows[i].pct;
  if (!nom) return;
  if (!pct || pct <= 0) {
    container.children[i].querySelector('input[data-f="pct"]').focus();
    return;
  }
  if (perso.find(p => p.nom === nom)) return;
  const item = {nom, pct};
  if (rows[i].unite) item.unite = rows[i].unite;
  perso.push(item);
  savePerso();
  container.children[i].querySelector('.btn-save-perso').classList.add('saved');
}

function selectAliment(i, a) {
  const r = rows[i];
  r.nom = a.nom;
  r.pct = a.pct;
  // A perso food with a portion weight switches the row to counting portions
  r.unite = a.unite || 0;
  r.pc = !!a.unite;
  if (r.pc && r.poids > 0) r.poids = r1(r.poids / r.unite);
  render(); // the quantity label and the g|pc button depend on the mode
  container.children[i].querySelector('input[data-f="poids"]').focus();
}

function togglePc(i) {
  const r = rows[i];
  if (!r.unite) return;
  r.poids = r.pc ? r1(r.poids * r.unite) : r1(r.poids / r.unite);
  r.pc = !r.pc;
  render();
  container.children[i].querySelector('input[data-f="poids"]').focus();
}

document.addEventListener('click', e => {
  if (!e.target.closest('.name-field')) {
    container.querySelectorAll('.dropdown.open').forEach(d => d.classList.remove('open'));
  }
});

function addRow() {
  rows.push({ nom: '', poids: 0, pct: 0 });
  render();
  const inputs = container.querySelectorAll('input[data-f="nom"]');
  if (inputs.length) inputs[inputs.length - 1].focus();
}

function delRow(i) {
  rows.splice(i, 1);
  render();
}

function resetAll() {
  const saisie = rows.some(r => r.nom || r.poids || r.pct);
  if (saisie && !confirm('Effacer la saisie en cours et commencer un nouveau repas ?')) return;
  rows = [];
  render();
}

if (!rows.length) addRow(); else render();
route();

// Register after load so the service worker never competes with the first render
if ('serviceWorker' in navigator) {
  const bar = document.getElementById('update-bar');
  let reloading = false;

  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloading) return;
    reloading = true;
    location.reload();
  });

  function offerUpdate(reg) {
    if (!reg.waiting || !navigator.serviceWorker.controller) return;
    bar.classList.add('show');
    bar.onclick = () => {
      bar.classList.remove('show');
      reg.waiting.postMessage('SKIP_WAITING');
    };
  }

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
      offerUpdate(reg);
      reg.addEventListener('updatefound', () => {
        const sw = reg.installing;
        if (!sw) return;
        sw.addEventListener('statechange', () => {
          if (sw.state === 'installed') offerUpdate(reg);
        });
      });
      // Check for a new version in the background, never on the critical path
      reg.update().catch(() => {});
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') reg.update().catch(() => {});
      });
    }).catch(() => {});
  });
}
</script>
</body>
</html>
